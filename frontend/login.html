<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - My Cinema</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center h-screen">
    <div class="bg-zinc-900 p-8 rounded-[2rem] border border-zinc-800 w-96 shadow-2xl">
        <h1 class="text-3xl font-black italic mb-6 text-center uppercase tracking-tighter">Connexion</h1>
        
        <form id="login-form" class="flex flex-col gap-4">
            <input type="email" id="email" placeholder="Email" required 
                class="bg-zinc-800 p-4 rounded-xl border border-zinc-700 focus:border-red-600 outline-none">
            <input type="password" id="password" placeholder="Mot de passe" required 
                class="bg-zinc-800 p-4 rounded-xl border border-zinc-700 focus:border-red-600 outline-none">
            
            <button type="submit" 
                class="bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition uppercase text-sm tracking-widest">
                Se connecter
            </button>
        </form>
        <p id="error-msg" class="text-red-500 text-xs mt-4 text-center hidden"></p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
