<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>MY CINEMA - Catalogue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .netflix-red { color: #E50914; }
        .title-premium { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; }
        /* Masquer la scrollbar pour un look plus propre */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #E50914; }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 flex justify-between items-center bg-black/80 sticky top-0 z-50 border-b border-white/5 backdrop-blur-md">
        <h1 class="text-3xl font-black netflix-red tracking-tighter italic">MY CINEMA</h1>
        <ul class="flex gap-8 text-[10px] font-black uppercase tracking-[0.2em]">
            <li><a href="index.html" class="text-gray-500 hover:text-white transition">Accueil</a></li>
            <li><a href="movies.html" class="netflix-red underline underline-offset-8 decoration-2">Films</a></li>
            <li><a href="rooms.html" class="text-gray-500 hover:text-white transition">Salles</a></li>
            <li><a href="planning.html" class="text-gray-500 hover:text-white transition">Planning</a></li>
        </ul>
    </nav>

    <main class="max-w-7xl mx-auto p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-8">
            <div>
                <p class="text-red-600 font-black text-[10px] uppercase tracking-[0.3em] mb-2">Bibliothèque numérique</p>
                <h2 class="text-5xl title-premium">Catalogue</h2>
            </div>
            <button onclick="toggleModal()" class="bg-red-600 hover:bg-red-700 text-white px-10 py-5 rounded-[1.5rem] font-black italic uppercase tracking-tighter transition-all hover:scale-105 shadow-xl shadow-red-600/20">
                + Ajouter un film
            </button>
        </header>

        <section class="flex flex-wrap gap-4 mb-12 bg-zinc-900/50 p-6 rounded-[2.5rem] border border-zinc-800/50 backdrop-blur-sm">
            <div class="flex-1 min-w-[200px]">
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 px-2">Filtrer par Genre</label>
                <select id="filter-genre" onchange="applyFilters()" class="w-full bg-black border border-zinc-700 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-red-600 transition text-sm appearance-none cursor-pointer">
                    <option value="">Tous les genres</option>
                    <option value="Action">Action</option>
                    <option value="Science-Fiction">Science-Fiction</option>
                    <option value="Drame">Drame</option>
                    <option value="Crime">Crime</option>
                    <option value="Thriller">Thriller</option>
                </select>
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 px-2">Année de sortie</label>
                <input type="number" id="filter-year" placeholder="Ex: 2024" oninput="applyFilters()" class="w-full bg-black border border-zinc-700 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-red-600 transition text-sm">
            </div>
            <div class="flex items-end pb-1">
                <button onclick="resetFilters()" class="px-6 py-4 text-zinc-500 hover:text-white transition font-black uppercase text-[10px] tracking-widest">
                    Réinitialiser
                </button>
            </div>
        </section>

        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-8">
            <div class="animate-pulse bg-zinc-900 aspect-[2/3] rounded-[2rem]"></div>
            <div class="animate-pulse bg-zinc-900 aspect-[2/3] rounded-[2rem]"></div>
            <div class="animate-pulse bg-zinc-900 aspect-[2/3] rounded-[2rem]"></div>
            <div class="animate-pulse bg-zinc-900 aspect-[2/3] rounded-[2rem]"></div>
            <div class="animate-pulse bg-zinc-900 aspect-[2/3] rounded-[2rem]"></div>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 p-10 rounded-[2.5rem] w-full max-w-2xl border border-zinc-800 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-3xl title-premium mb-8 uppercase">Nouveau Film</h3>
            
            <form id="add-movie-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Titre du film</label>
                        <input type="text" id="title" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">URL de la Jaquette (TMDB)</label>
                        <input type="text" id="poster_url" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" placeholder="https://image.tmdb.org/...">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Année de sortie</label>
                        <input type="number" id="release_year" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Durée (minutes)</label>
                        <input type="number" id="duration" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Genre</label>
                        <input type="text" id="genre" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Réalisateur</label>
                        <input type="text" id="director" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-2">Synopsis</label>
                    <textarea id="description" rows="3" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition"></textarea>
                </div>
                
                <div class="flex justify-end gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 px-4 py-4 rounded-xl font-bold text-gray-500 hover:text-white transition uppercase text-xs">Annuler</button>
                    <button id="submit-btn" type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-xl font-black uppercase italic tracking-tighter transition shadow-lg shadow-red-600/20">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/movies.js"></script>
</body>
</html>
