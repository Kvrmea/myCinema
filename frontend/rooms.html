<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CINEMA - Gestion des Salles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: white; font-family: 'Inter', sans-serif; }
        .netflix-red { color: #E50914; }
        .bg-card { background: rgba(23, 23, 23, 0.6); backdrop-filter: blur(10px); }
        .title-premium { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; }
        /* Animation de zoom douce pour les cartes */
        .room-card img { transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        .room-card:hover img { transform: scale(1.1); }
    </style>
</head>
<body class="antialiased">

    <nav class="p-6 flex justify-between items-center bg-black/80 sticky top-0 z-50 border-b border-white/5">
        <h1 class="text-3xl font-black netflix-red tracking-tighter italic">MY CINEMA</h1>
        <ul class="flex gap-8 text-[10px] font-black uppercase tracking-[0.2em]">
            <li><a href="index.html" class="text-gray-500 hover:text-white transition">Accueil</a></li>
            <li><a href="movies.html" class="text-gray-500 hover:text-white transition">Films</a></li>
            <li><a href="rooms.html" class="netflix-red underline underline-offset-8 decoration-2">Salles</a></li>
            <li><a href="planning.html" class="text-gray-500 hover:text-white transition">Planning</a></li>
        </ul>
    </nav>

    <main class="max-w-7xl mx-auto p-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-end mb-16 gap-8">
            <div>
                <p class="text-red-600 font-black text-[10px] uppercase tracking-[0.3em] mb-2">Infrastructures</p>
                <h2 class="text-5xl title-premium">Nos Salles</h2>
            </div>
            <button onclick="toggleModal()" class="bg-red-600 hover:bg-red-700 text-white px-10 py-5 rounded-[1.5rem] font-black italic uppercase tracking-tighter transition-all hover:scale-105 shadow-xl shadow-red-600/20">
                + Ajouter une salle
            </button>
        </header>

        <div id="rooms-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <div class="animate-pulse bg-zinc-900/50 h-[400px] rounded-[3rem] border border-zinc-800"></div>
            <div class="animate-pulse bg-zinc-900/50 h-[400px] rounded-[3rem] border border-zinc-800"></div>
            <div class="animate-pulse bg-zinc-900/50 h-[400px] rounded-[3rem] border border-zinc-800"></div>
        </div>
    </main>

    <div id="room-modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 p-10 rounded-[2.5rem] w-full max-w-md border border-zinc-800 shadow-2xl">
            <h3 id="modal-title" class="text-3xl title-premium mb-8">Ajouter une salle</h3>
            
            <form id="room-form" class="space-y-6">
                <input type="hidden" id="room-id">
                
                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-2">Nom de la salle</label>
                    <input type="text" id="room-name" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" placeholder="ex: Salle IMAX 1" required>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-2">Capacité (sièges)</label>
                    <input type="number" id="room-capacity" class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition" placeholder="ex: 350" required>
                </div>

                <div>
                    <label class="block text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-2">Image de couverture (URL)</label>
                    <input type="text" id="room-image" placeholder="https://images.unsplash.com/..." class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition">
                </div>
                
                <div class="flex justify-end gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 px-4 py-4 rounded-xl font-bold text-gray-500 hover:text-white transition uppercase text-xs tracking-widest">
                        Annuler
                    </button>
                    <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-xl font-black uppercase italic tracking-tighter transition shadow-lg shadow-red-600/20">
                        Enregistrer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/rooms.js"></script>
</body>
</html>
