<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY CINEMA - Gestion des Salles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .netflix-red { color: #E50914; }
        .netflix-bg-red { background-color: #E50914; }
        /* Animation de zoom douce */
        .room-card img { transition: transform 0.5s ease; }
        .room-card:hover img { transform: scale(1.1); }
    </style>
</head>
<body>
    <nav class="flex items-center justify-between px-10 py-5 bg-black sticky top-0 z-50 shadow-2xl">
        <div class="flex items-center gap-10">
            <h1 class="text-3xl font-bold netflix-red tracking-tighter">MY CINEMA</h1>
            <ul class="flex gap-5 text-sm font-light text-gray-300">
                <li><a href="index.html" class="hover:text-white transition">Accueil</a></li>
                <li><a href="movies.html" class="hover:text-white transition">Films</a></li>
                <li><a href="rooms.html" class="text-white font-bold border-b-2 border-red-600 pb-1">Salles</a></li>
                <li><a href="planning.html" class="hover:text-white transition">Planning</a></li>
            </ul>
        </div>
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-blue-600 rounded-sm"></div>
        </div>
    </nav>

    <main class="px-10 py-12">
        <header class="flex justify-between items-end mb-10">
            <div>
                <p class="text-gray-400 text-sm uppercase tracking-widest mb-1">Configuration</p>
                <h2 class="text-4xl font-bold">Nos Salles</h2>
            </div>
            <button onclick="toggleModal()" class="netflix-bg-red px-6 py-2.5 rounded text-sm font-bold hover:bg-red-700 transition duration-300 shadow-lg">
                + AJOUTER UNE SALLE
            </button>

        </header>

        <div id="rooms-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="animate-pulse bg-zinc-800 h-64 rounded-lg"></div>
            <div class="animate-pulse bg-zinc-800 h-64 rounded-lg"></div>
            <div class="animate-pulse bg-zinc-800 h-64 rounded-lg"></div>
        </div>
    </main>

    <div id="room-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-[100]">
        <div class="bg-zinc-900 p-8 rounded-lg w-full max-w-md border border-zinc-700 shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-bold mb-6">Ajouter une salle</h3>
            <form id="room-form" class="space-y-4">
                <input type="hidden" id="room-id">
                <div>
                    <label class="text-xs text-gray-400 uppercase font-bold">Nom de la salle</label>
                    <input type="text" id="room-name" class="w-full bg-zinc-800 p-3 rounded border border-zinc-600 focus:border-red-600 outline-none" required>
                </div>
                <div>
                    <label class="text-xs text-gray-400 uppercase font-bold">Capacité (sièges)</label>
                    <input type="number" id="room-capacity" class="w-full bg-zinc-800 p-3 rounded border border-zinc-600 focus:border-red-600 outline-none" required>
                </div>
                <div>
                    <label class="text-xs text-gray-400 uppercase font-bold">URL de l'image (Unsplash)</label>
                    <input type="text" id="room-image" placeholder="https://images.unsplash.com/..." class="w-full bg-zinc-800 p-3 rounded border border-zinc-600 focus:border-red-600 outline-none">
                </div>
                
                <div class="flex justify-end gap-4 mt-8">
                    <button type="button" onclick="toggleModal()" class="text-gray-400 hover:text-white font-bold">ANNULER</button>
                    <button type="submit" class="netflix-bg-red px-8 py-2 rounded font-bold hover:bg-red-700">ENREGISTRER</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/rooms.js"></script>
</body>
</html>
