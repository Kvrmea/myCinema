<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cinema - Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; }
        .netflix-red { color: #E50914; }
        .hour-glow { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    </style>
</head>
<body class="antialiased font-sans">

    <nav class="p-6 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-3xl font-black text-red-600 tracking-tighter">MY CINEMA</h1>
        <div class="space-x-8 font-bold uppercase text-sm tracking-widest">
            <a href="index.html" class="hover:text-red-500 transition">Accueil</a>
            <a href="movies.html" class="hover:text-red-500 transition">Films</a>
            <a href="planning.html" class="text-red-600">Planning</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8">
        <div class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-5xl font-black italic uppercase tracking-tighter">Gestion du Planning</h2>
                <p class="text-gray-500 mt-2 font-medium">Organisez vos séances par salle et suivez les diffusions en direct.</p>
            </div>
            <button onclick="toggleModal()" class="bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-2xl font-black transition-all hover:scale-105 shadow-lg shadow-red-600/20">
                + PROGRAMMER UNE SÉANCE
            </button>
        </div>

        <div id="planning-container" class="relative">
            <div class="flex flex-col items-center justify-center py-20 text-gray-600">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-600 mb-4"></div>
                <p>Chargement du planning...</p>
            </div>
        </div>
    </main>

    <div id="modal" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
        <div class="bg-zinc-900 p-8 rounded-3xl w-full max-w-md border border-zinc-800 shadow-2xl">
            
            <h2 id="modal-title" class="text-3xl font-black mb-6 uppercase tracking-tight">Programmer une séance</h2>

            <form id="add-screening-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Film</label>
                    <select id="movie_id" required class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition">
                        </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Salle de projection</label>
                    <select id="room_id" required class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition">
                        </select>
                </div>

                <div>
                    <label class="block text-xs font-black text-gray-500 uppercase tracking-widest mb-2">Date et Heure de début</label>
                    <input type="datetime-local" id="start_time" required class="w-full bg-black border border-zinc-700 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-red-600 transition text-white">
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="toggleModal()" class="flex-1 px-4 py-4 rounded-xl font-bold text-gray-400 hover:bg-zinc-800 transition">
                        Annuler
                    </button>
                    <button id="submit-btn" type="submit" class="flex-1 px-4 py-4 rounded-xl font-black bg-red-600 hover:bg-red-700 text-white transition-all shadow-lg shadow-red-600/30">
                        Confirmer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/planning.js"></script>
</body>
</html>
