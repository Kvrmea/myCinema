<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>MY CINEMA - Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; font-family: 'Helvetica Neue', Arial, sans-serif; }
        .netflix-red { color: #E50914; }
        .netflix-bg-red { background-color: #E50914; }
        .hour-glow { text-shadow: 0 0 10px rgba(229, 9, 20, 0.5); }
        .timeline-line { border-left: 2px solid #333; }
        
        /* Style pour l'input datetime-local pour qu'il soit sombre */
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body>
    <nav class="flex items-center justify-between px-10 py-5 bg-black sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <h1 class="text-3xl font-bold netflix-red tracking-tighter">MY CINEMA</h1>
            <ul class="flex gap-5 text-sm font-light text-gray-300">
                <li><a href="index.html" class="hover:text-white transition">Accueil</a></li>
                <li><a href="movies.html" class="hover:text-white transition">Films</a></li>
                <li><a href="rooms.html" class="hover:text-white transition">Salles</a></li>
                <li><a href="planning.html" class="text-white font-bold border-b-2 border-red-600 pb-1">Planning</a></li>
            </ul>
        </div>
    </nav>

    <main class="px-10 py-12 max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-4xl font-bold mb-2">Programmation</h2>
                <p class="text-gray-400">Gérez les séances et les horaires de diffusion.</p>
            </div>
            <button onclick="toggleModal(); loadFormOptions();" class="netflix-bg-red px-6 py-3 rounded font-bold hover:bg-red-700 transition shadow-lg">
                + PROGRAMMER UNE SÉANCE
            </button>
        </header>

        <div id="planning-container" class="relative timeline-line ml-4 pl-8 space-y-12">
            </div>
    </main>

    <div id="screening-modal" class="fixed inset-0 bg-black/90 hidden flex items-center justify-center z-[100] backdrop-blur-sm">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-white flex items-center gap-2">
                <span class="w-2 h-8 bg-red-600 rounded-full"></span>
                Programmer une séance
            </h2>
            
            <form id="screening-form" class="space-y-5">
                <div>
                    <label class="block text-zinc-400 text-sm mb-2">Choisir le film</label>
                    <select id="movie-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none transition" required>
                        </select>
                </div>

                <div>
                    <label class="block text-zinc-400 text-sm mb-2">Choisir la salle</label>
                    <select id="room-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none transition" required>
                        </select>
                </div>

                <div>
                    <label class="block text-zinc-400 text-sm mb-2">Date et heure de début</label>
                    <input type="datetime-local" id="screening-date" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-red-600 outline-none transition" required>
                </div>
                
                <div class="flex gap-3 pt-6">
                    <button type="button" onclick="toggleModal()" class="flex-1 px-6 py-3 border border-zinc-700 text-zinc-300 rounded-xl font-bold hover:bg-zinc-800 transition">
                        Annuler
                    </button>
                    <button type="submit" class="flex-1 px-6 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-700 shadow-lg shadow-red-900/20 transition">
                        Confirmer
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/planning.js"></script>
</body>
</html>
